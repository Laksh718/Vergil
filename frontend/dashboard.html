<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERGIL — Training Dashboard (React)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Recharts -->
    <script src="https://unpkg.com/prop-types@15.6/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.min.js" crossorigin></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a; --card: #1e293b; --border: hsla(220,30%,28%,0.4);
            --text: #f8fafc; --dim: #64748b; --sec: #94a3b8;
            --green: #22c55e; --red: #ef4444; --blue: #3b82f6;
            --purple: #a855f7; --cyan: #06b6d4; --yellow: #eab308;
            --glass: rgba(30, 41, 59, 0.7);
        }
        body {
            font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 0; -webkit-font-smoothing: antialiased;
        }
        
        .topbar {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; background: var(--glass);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
        }
        .topbar h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .topbar h1 span.gradient { 
            background: linear-gradient(135deg, #60a5fa, #a855f7); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        
        .metric-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; position: relative; overflow: hidden;
        }
        .metric-card.glass {
            background: linear-gradient(145deg, rgba(30,41,59,0.8), rgba(15,23,42,0.8));
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .metric-card .title { font-size: 13px; font-weight: 600; color: var(--sec); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-card .value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 800; margin: 8px 0; color: #fff; }
        .metric-card .delta { font-size: 13px; font-weight: 600; display:flex; align-items:center; gap:4px; }
        .delta.up { color: var(--green); }
        .delta.down { color: var(--red); }
        .delta.neutral { color: var(--cyan); }
        
        .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        @media (max-width: 1024px) { .charts-grid { grid-template-columns: 1fr; } }
        
        .chart-container {
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; height: 360px; display: flex; flex-direction: column;
        }
        .chart-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
        }
        .chart-title { font-size: 16px; font-weight: 600; color: #fff; display: flex; align-items: center; gap: 8px; }
        
        button.primary {
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px;
            background: linear-gradient(135deg, var(--blue), var(--purple)); color: #fff;
            border: none; cursor: pointer; transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        button.primary:hover { opacity: 0.9; transform: translateY(-1px); }
        button.primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        button.secondary {
            padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 13px;
            background: transparent; color: var(--sec); border: 1px solid var(--border);
            cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-flex; align-items: center;
        }
        button.secondary:hover { background: rgba(255,255,255,0.05); color: #fff; }
        
        .log-panel {
            background: #0d1322; border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; overflow: hidden; display: flex; flex-direction: column;
        }
        .log-content {
            font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--sec);
            overflow-y: auto; max-height: 250px; line-height: 1.6; white-space: pre-wrap; margin-top: 12px;
        }
        .log-content::-webkit-scrollbar { width: 6px; }
        .log-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        .loading-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 60vh; gap: 16px; color: var(--sec);
        }
        .spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--blue); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Custom Tooltip */
        .custom-tooltip {
            background: rgba(15, 23, 42, 0.95); border: 1px solid var(--border);
            border-radius: 8px; padding: 12px; backdrop-filter: blur(4px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .custom-tooltip .label { color: var(--sec); font-size: 12px; font-weight: 600; margin-bottom: 8px; }
        .custom-tooltip .item { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; display:flex; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { 
            LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer,
            AreaChart, Area, BarChart, Bar, ComposedChart, Cell
        } = Recharts;

        // Custom Tooltip Component
        const CustomTooltip = ({ active, payload, label }) => {
            if (active && payload && payload.length) {
                return (
                    <div className="custom-tooltip">
                        <div className="label">Episode {label}</div>
                        {payload.map((entry, index) => (
                            <div key={index} className="item" style={{ color: entry.color }}>
                                <span>{entry.name}</span>
                                <span>{typeof entry.value === 'number' ? entry.value.toFixed(entry.value % 1 === 0 ? 0 : 3) : entry.value}</span>
                            </div>
                        ))}
                    </div>
                );
            }
            return null;
        };

        const Dashboard = () => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [training, setTraining] = useState(false);
            const [error, setError] = useState(null);

            const fetchData = async () => {
                setLoading(true);
                setError(null);
                try {
                    const res = await fetch('/api/training-results');
                    if (!res.ok) throw new Error('No training data found.');
                    const json = await res.json();
                    
                    // Process data slightly for Recharts
                    const processedCurve = json.curve.map(c => ({
                        ...c,
                        fulfillment_pct: (c.avg_fulfillment || 0) * 100
                    }));
                    
                    setData({ ...json, curve: processedCurve });
                } catch (err) {
                    setError(err.message);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchData(); }, []);

            const handleTrain = async () => {
                setTraining(true);
                try {
                    await fetch('/api/train', { method: 'POST' });
                    await fetchData();
                } catch(e) {
                    console.error(e);
                    alert("Training failed to start.");
                } finally {
                    setTraining(false);
                }
            };

            if (loading) return (
                <div className="loading-screen">
                    <div className="spinner"></div>
                    <div>Loading Telemetry Data...</div>
                </div>
            );

            if (error) return (
                <div style={{padding: '40px', textAlign: 'center'}}>
                    <div style={{fontSize: '48px', marginBottom: '16px'}}>📊</div>
                    <h2 style={{marginBottom: '8px'}}>{error}</h2>
                    <p style={{color: 'var(--sec)', marginBottom: '24px'}}>Run the RL baseline locally to generate data.</p>
                    <button className="primary" onClick={handleTrain} disabled={training}>
                        {training ? 'Training...' : '🚀 Run RL Training Now'}
                    </button>
                    &nbsp;&nbsp;
                    <a href="/"><button className="secondary">← Back to App</button></a>
                </div>
            );

            const { results, curve } = data;
            const ba = results.before_after || {};

            // Bar chart data for Before vs After
            const comparisonData = [
                { metric: 'Avg Reward', before: ba.pre_training_reward, after: ba.post_training_reward },
                { metric: 'Fulfillment %', before: (ba.pre_training_fulfillment||0)*100, after: (ba.post_training_fulfillment||0)*100 }
            ];

            return (
                <div>
                    <div className="topbar">
                        <h1>🧠 <span className="gradient">VERGIL</span> Insights</h1>
                        <div style={{display: 'flex', gap: '12px', alignItems: 'center'}}>
                            <a href="/"><button className="secondary">← Interactive Demo</button></a>
                            <button className="primary" onClick={handleTrain} disabled={training}>
                                {training ? '⏳ Training...' : '🚀 Retrain Policy'}
                            </button>
                        </div>
                    </div>

                    <div className="container">
                        {/* Metrics Grid */}
                        <div className="grid">
                            <div className="metric-card glass">
                                <div className="title">Policy Model</div>
                                <div className="value">{results.algorithm || 'REINFORCE'}</div>
                                <div className="delta neutral">{(results.policy_params||0).toLocaleString()} params</div>
                            </div>
                            
                            <div className="metric-card glass">
                                <div className="title">Episodes</div>
                                <div className="value">{results.total_episodes || 0}</div>
                                <div className="delta neutral">{(results.elapsed_seconds||0).toFixed(1)}s compute time</div>
                            </div>

                            <div className="metric-card glass">
                                <div className="title">Fulfillment Win Rate</div>
                                <div className="value" style={{color: 'var(--green)'}}>
                                    {((ba.post_training_fulfillment||0)*100).toFixed(1)}%
                                </div>
                                <div className={`delta ${(ba.fulfillment_improvement||0) >= 0 ? 'up' : 'down'}`}>
                                    {(ba.fulfillment_improvement||0) >= 0 ? '↑' : '↓'} {Math.abs((ba.fulfillment_improvement||0)*100).toFixed(1)}% vs baseline
                                </div>
                            </div>

                            <div className="metric-card glass">
                                <div className="title">Max Curriculum Stage</div>
                                <div className="value" style={{color: 'var(--cyan)'}}>{results.final_stage || 1}</div>
                                <div className="delta up">↑ {(results.final_stage||1) - 1} stages unlocked</div>
                            </div>
                        </div>

                        {/* Charts Area */}
                        <div className="charts-grid">
                            
                            {/* Reward Progression */}
                            <div className="chart-container">
                                <div className="chart-header">
                                    <h2 className="chart-title">📈 Reward Progression</h2>
                                </div>
                                <div style={{flex: 1, minHeight: 0}}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={curve} margin={{ top: 5, right: 5, left: 0, bottom: 5 }}>
                                            <defs>
                                                <linearGradient id="colorReward" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/>
                                                    <stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="episode" stroke="#64748b" tick={{fontSize: 11}} minTickGap={30} />
                                            <YAxis stroke="#64748b" tick={{fontSize: 11}} width={35} />
                                            <Tooltip content={<CustomTooltip />} />
                                            <Area type="monotone" dataKey="avg_reward" name="Average Reward" stroke="#3b82f6" strokeWidth={2} fillOpacity={1} fill="url(#colorReward)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Fulfillment Rate */}
                            <div className="chart-container">
                                <div className="chart-header">
                                    <h2 className="chart-title">🎯 Fulfillment Evolution</h2>
                                </div>
                                <div style={{flex: 1, minHeight: 0}}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <AreaChart data={curve} margin={{ top: 5, right: 5, left: 0, bottom: 5 }}>
                                            <defs>
                                                <linearGradient id="colorFulfill" x1="0" y1="0" x2="0" y2="1">
                                                    <stop offset="5%" stopColor="#22c55e" stopOpacity={0.3}/>
                                                    <stop offset="95%" stopColor="#22c55e" stopOpacity={0}/>
                                                </linearGradient>
                                            </defs>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="episode" stroke="#64748b" tick={{fontSize: 11}} minTickGap={30} />
                                            <YAxis stroke="#64748b" tick={{fontSize: 11}} width={35} />
                                            <Tooltip content={<CustomTooltip />} />
                                            <Area type="monotone" dataKey="fulfillment_pct" name="Fulfillment %" stroke="#22c55e" strokeWidth={2} fillOpacity={1} fill="url(#colorFulfill)" />
                                        </AreaChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Trust Dynamics */}
                            <div className="chart-container">
                                <div className="chart-header">
                                    <h2 className="chart-title">🤝 Trust Preservation</h2>
                                </div>
                                <div style={{flex: 1, minHeight: 0}}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <LineChart data={curve} margin={{ top: 5, right: 5, left: 0, bottom: 5 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="episode" stroke="#64748b" tick={{fontSize: 11}} minTickGap={30} />
                                            <YAxis stroke="#64748b" tick={{fontSize: 11}} width={35} domain={[0, 1]} />
                                            <Tooltip content={<CustomTooltip />} />
                                            <Line type="monotone" dataKey="avg_trust" name="Avg Stakeholder Trust" stroke="#06b6d4" strokeWidth={2} dot={false} />
                                        </LineChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                            {/* Loss Curves */}
                            <div className="chart-container">
                                <div className="chart-header">
                                    <h2 className="chart-title">📉 Actor-Critic Loss</h2>
                                </div>
                                <div style={{flex: 1, minHeight: 0}}>
                                    <ResponsiveContainer width="100%" height="100%">
                                        <ComposedChart data={curve} margin={{ top: 5, right: 5, left: 0, bottom: 5 }}>
                                            <CartesianGrid strokeDasharray="3 3" stroke="#334155" vertical={false} />
                                            <XAxis dataKey="episode" stroke="#64748b" tick={{fontSize: 11}} minTickGap={30} />
                                            <YAxis yAxisId="left" stroke="#64748b" tick={{fontSize: 11}} width={35} />
                                            <YAxis yAxisId="right" orientation="right" stroke="#64748b" tick={{fontSize: 11}} width={35} />
                                            <Tooltip content={<CustomTooltip />} />
                                            <Legend iconType="circle" wrapperStyle={{fontSize: '12px'}} />
                                            <Line yAxisId="left" type="monotone" dataKey="policy_loss" name="Policy Loss" stroke="#f97316" strokeWidth={1.5} dot={false} />
                                            <Line yAxisId="right" type="monotone" dataKey="value_loss" name="Value Loss" stroke="#a855f7" strokeWidth={1.5} dot={false} />
                                        </ComposedChart>
                                    </ResponsiveContainer>
                                </div>
                            </div>

                        </div>

                        {/* Training Log Section */}
                        <div className="log-panel">
                            <h2 className="chart-title">📜 RL Telemetry Log</h2>
                            <div className="log-content">
                                {curve.map((c, i) => (
                                    <div key={i}>
                                        <span style={{color:'#3b82f6'}}>EP {String(c.episode).padStart(4, '0')}</span> | 
                                        STAGE {c.stage || 1} | 
                                        R: <span style={{color: c.avg_reward >= 0 ? '#22c55e' : '#ef4444'}}>{(c.avg_reward||0) >= 0 ? '+' : ''}{(c.avg_reward||0).toFixed(4)}</span> | 
                                        FULFILL: {((c.avg_fulfillment||0)*100).toFixed(1).padStart(5)}% | 
                                        TRUST: {(c.avg_trust||0).toFixed(3)} | 
                                        P_LOSS: {(c.policy_loss||0).toFixed(4)} | 
                                        V_LOSS: {(c.value_loss||0).toFixed(4)} | 
                                        EPS/s: {(c.eps_per_sec||0).toFixed(1)}
                                    </div>
                                ))}
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
